name: Build and deploy Python app to Azure Web App - attijari-detection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Archive app for deployment
        run: |
          # Only include your application folder (web_app) and backend
          zip -r python-app.zip web_app Backend -x "*.git*" "*.venv*" "tests/*" "data/*" "output/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8ADD3C781EE4EB4B316683CBC2E0003 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2525B71322BC4B78B772AC130B9F9EDF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8C9B4EFA9B8B430396D7B542F6F787A1 }}

      - name: Clean App Service before deploy
        run: |
          az webapp restart --name attijari-detection-2025 --resource-group <your-resource-group>

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'attijari-detection-2025'
          package: python-app.zip
          startup-command: 'gunicorn --bind 0.0.0.0 --timeout 600 --chdir web_app app:app'

